apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels:
    app: resume-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-bot
  template:
    metadata:
      labels:
        app: resume-bot
    spec:
      containers:
        - name: bot
          # Registry на хосте: Linux/VPS — 127.0.0.1:5001; Mac (Docker Desktop) — host.docker.internal:5001
          image: 127.0.0.1:5001/myresume-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: OFFER_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: OFFER_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: TELEGRAM_CHAT_ID
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

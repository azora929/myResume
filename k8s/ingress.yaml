# Домен: myresume-azora.ru (A-запись должна указывать на IP сервера).
# Для выдачи TLS-сертификата нужен ingress-контроллер с поддержкой Ingress
# (например nginx-ingress или traefik) и, при необходимости, cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: myresume-azora.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
    - host: www.myresume-azora.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
  tls:
    - hosts:
        - myresume-azora.ru
        - www.myresume-azora.ru
      secretName: resume-tls

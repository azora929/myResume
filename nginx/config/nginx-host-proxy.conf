# Nginx на хосте: слушает 80/443, проксирует напрямую в webapp (NodePort 30080).
# Ingress не используется — так избегаем 404 из-за Host/default backend.

upstream webapp {
    server 127.0.0.1:30080;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name myresume-azora.ru www.myresume-azora.ru _;
    location / {
        proxy_pass http://webapp;
        proxy_set_header Host myresume-azora.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name myresume-azora.ru www.myresume-azora.ru _;
    ssl_certificate     /etc/nginx/ssl/myresume.crt;
    ssl_certificate_key /etc/nginx/ssl/myresume.key;
    location / {
        proxy_pass http://webapp;
        # Всегда слать домен в backend (при запросе по IP $host = IP и бэкенд может отдать 404)
        proxy_set_header Host myresume-azora.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Served-By "resume-443" always;
    }
}
